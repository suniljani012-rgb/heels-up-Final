    <!-- ═══════════════════════════════════════════════════════
         PERFORMANCE: Critical resource hints — establish
         connections to image CDN & API worker BEFORE JS loads
         ═══════════════════════════════════════════════════════ -->

    <!-- Image CDN — most images served from here (highest priority) -->
    <link rel="preconnect" href="https://media.heelsup.in" crossorigin />
    <link rel="dns-prefetch" href="https://media.heelsup.in" />

    <!-- API Worker -->
    <link rel="preconnect" href="https://heelsupnew.heelsup.workers.dev" />
    <link rel="dns-prefetch" href="https://heelsupnew.heelsup.workers.dev" />
    <link rel="preconnect" href="https://heelsup.in" />
    <link rel="dns-prefetch" href="https://heelsup.in" />

    <!-- Google Fonts: split into two requests — body font first (faster paint), display font second -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Body font: DM Sans — load eagerly, it's used everywhere -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet" />
    <!-- Display fonts: Cormorant Garamond + Playfair Display — preload but non-blocking -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" /></noscript>

    <!-- ═══════════════════════════════════════════════════════
